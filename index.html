<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="고장 감지">
<title>스마트 고장 감지</title>
<style>
  :root { --navy:#0C447C; --bg:#F1EFE8; --ok:#3B6D11; --okLine:#639922; --bad:#A32D2D; --badLine:#E24B4A; --badBg:#FCEBEB; --gray:#5F5E5A; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); color:#2C2C2A;
         font-family:-apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  header { background:#fff; padding:14px 20px; padding-top:calc(14px + env(safe-area-inset-top));
           border-bottom:1px solid #E3E1D9; display:flex; align-items:center; justify-content:center; }
  header img { height:40px; width:auto; display:block; }
  main { flex:1; padding:18px; max-width:480px; width:100%; margin:0 auto; }
  .card { background:#fff; border-radius:16px; padding:16px 18px; }
  #statusCard { text-align:center; padding:28px 18px; border:3px solid var(--okLine); transition:background .3s, border-color .3s; }
  #statusCard .label { font-size:14px; color:var(--gray); }
  #statusIcon { font-size:56px; line-height:1; margin:12px 0 6px; }
  #statusText { font-size:34px; font-weight:700; color:var(--ok); }
  #statusSub { font-size:14px; color:var(--gray); margin-top:6px; }
  .fault #statusCard { background:var(--badBg); border-color:var(--badLine); animation:blink 1s infinite; }
  .fault #statusText { color:var(--bad); }
  .offline #statusCard { border-color:#B4B2A9; }
  .offline #statusText { color:var(--gray); }
  @keyframes blink { 50% { border-color:#F7C1C1; } }
  .info { margin-top:14px; font-size:15px; }
  .row { display:flex; justify-content:space-between; padding:9px 0; }
  .row + .row { border-top:1px solid #EEEDE6; }
  .row span:first-child { color:var(--gray); }
  #updated { text-align:center; font-size:12px; color:#888780; margin-top:14px; }
</style>
</head>
<body>
<header><img src="knu_logo.png" alt="강원대학교 KANGWON NATIONAL UNIVERSITY"></header>

<main>
  <div class="card" id="statusCard">
    <div class="label">현재 상태</div>
    <div id="statusIcon">⏳</div>
    <div id="statusText">확인 중</div>
    <div id="statusSub">&nbsp;</div>
  </div>

  <div class="card info">
    <div class="row"><span>장치</span><span id="devName">-</span></div>
    <div class="row"><span>최근 고장</span><span id="lastFault">-</span></div>
    <div class="row"><span>누적 고장</span><span id="count">-</span></div>
  </div>

  <div id="updated">마지막 갱신 -</div>
</main>


<script>
  // ================= 설정 =================
  const FIREBASE_DB_URL = "https://accident-detector-e137a-default-rtdb.asia-southeast1.firebasedatabase.app"; // ESP32 코드와 동일
  const DEVICE_ID = "device1";          // ESP32 코드의 DEVICE_ID와 동일
  const POLL_MS = 2000;                 // 상태 확인 주기
  const OFFLINE_MS = 90000;             // 이 시간 동안 장치 신호가 없으면 "연결 끊김"
  // ========================================

  const $ = id => document.getElementById(id);
  const fmt = ts => {
    if (!ts) return "-";
    const d = new Date(ts), p = n => String(n).padStart(2, "0");
    return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  };
  let wasFault = null;

  function render(s) {
    const offline = !s || !s.updated || Date.now() - s.updated > OFFLINE_MS;
    const fault = !offline && !!s.fault;
    document.body.className = offline ? "offline" : (fault ? "fault" : "");

    if (offline) {
      $("statusIcon").textContent = "📡";
      $("statusText").textContent = "연결 끊김";
      $("statusSub").textContent = s ? "장치에서 신호가 들어오지 않습니다" : "장치 데이터가 아직 없습니다";
    } else if (fault) {
      $("statusIcon").textContent = "⚠️";
      $("statusText").textContent = "고장 발생";
      $("statusSub").textContent = "즉시 점검이 필요합니다";
    } else {
      $("statusIcon").textContent = "✅";
      $("statusText").textContent = "정상";
      $("statusSub").textContent = "설비가 정상 작동 중입니다";
    }
    document.querySelector('meta[name="theme-color"]').content = fault ? "#FCEBEB" : "#FFFFFF";

    if (s) {
      $("devName").textContent = s.name || DEVICE_ID;
      $("lastFault").textContent = fmt(s.lastFault);
      $("count").textContent = (s.count ?? 0) + "회";
      $("updated").textContent = "마지막 갱신 " + fmt(s.updated);
    }
    if (fault && wasFault === false && navigator.vibrate) navigator.vibrate([400, 200, 400]);
    wasFault = fault;
  }

  async function poll() {
    try {
      const r = await fetch(`${FIREBASE_DB_URL}/devices/${DEVICE_ID}/state.json`, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      render(await r.json());
    } catch (e) {
      $("updated").textContent = "⚠ 서버에 연결할 수 없습니다 (인터넷 확인)";
    }
  }
  poll();
  setInterval(poll, POLL_MS);
</script>
</body>
</html>
